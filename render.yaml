# Render Blueprint — Emotiv portal
#
# This branch is the Emotiv tenant. It deploys as its own service, separate
# from comer-platform. See DEPLOY.md §7.
#
#   1. Open https://dashboard.render.com/blueprints
#   2. "New Blueprint Instance" → this repo + the `platform-emotiv` branch
#   3. Render prompts for the `sync: false` secrets.
#   4. Add `emotiv.daedalusiq.com` as a custom domain and create the CNAME.

services:
  - type: web
    name: emotiv-platform
    runtime: node
    plan: starter
    region: oregon
    branch: platform-emotiv
    rootDir: .
    autoDeploy: true

    # NODE_ENV=production omits devDependencies by default; tsc needs
    # typescript + @types/* at build time.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Same-origin pages do not need CORS. These are the hosts allowed to
      # call the API if a page is ever served from elsewhere.
      - key: ALLOWED_ORIGINS
        value: "https://emotiv.daedalusiq.com,https://emotiv-platform.onrender.com"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      # Sign-in. The hash is scrypt$N$r$p$salt$hash. With either unset, login
      # stays closed and the portal refuses every page.
      - key: EMOTIV_AUTH_EMAIL
        sync: false
      - key: EMOTIV_AUTH_NAME
        sync: false
      - key: EMOTIV_AUTH_PASSWORD_HASH
        sync: false
